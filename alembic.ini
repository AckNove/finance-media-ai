[alembic]
# Alembic configuration.
# NOTE: this file must stay ASCII-only. On Windows, Alembic/Python reads it with
# the locale encoding (GBK on zh-CN systems), so non-ASCII bytes break parsing.
#
# The database URL is intentionally NOT set here: backend/migrations/env.py
# resolves it from the application settings (DATABASE_URL env var / .env), so
# the app and the migration tool always agree on one source of truth.
script_location = backend/migrations
prepend_sys_path = .
path_separator = os
version_path_separator = os

# Timestamped migration filenames keep ordering obvious.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# Left empty on purpose; env.py injects the real URL.
sqlalchemy.url =


[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
