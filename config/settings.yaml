# ============================================================
# finance-media-ai 全局运行配置
# 注意：本文件只放非敏感的应用配置。密钥一律走环境变量（见 .env.example）。
# ============================================================

app:
  name: finance-media-ai
  version: 0.1.0
  description: 金融知识自媒体研究与内容生产平台
  api_prefix: /api
  docs_url: /docs
  redoc_url: /redoc

server:
  host: 127.0.0.1
  port: 8000
  # 第一阶段为本地单体服务，不引入反向代理与容器编排
  workers: 1

database:
  # 默认值，可被环境变量 DATABASE_URL 覆盖
  url: sqlite:///./data/finance_media.db
  echo: false
  # 第一阶段使用 SQLite；模型层不使用 SQLite 专有类型，便于后续迁移 PostgreSQL
  target_production_dialect: postgresql
  pool_pre_ping: true

logging:
  level: INFO
  format: "%(asctime)s | %(levelname)-7s | %(name)s | %(message)s"

paths:
  config_dir: config
  agents_dir: agents
  knowledge_dir: knowledge
  content_dir: content
  prompts_dir: prompts
  data_dir: data
  video_engine_dir: video_engine

pagination:
  default_limit: 20
  max_limit: 100

# --- M2.0 新增：执行层开关 ---
# 只有 execution 相关能力全部就绪后才会被置为 true；2.0 阶段一律 false。
execution:
  enabled: false
  worker_poll_seconds: 1.0
  # 本地单机 SQLite 只允许串行消费（M2.0 D12）
  max_concurrency: 1
  lease_seconds: 300
  heartbeat_seconds: 100
  # 生产环境禁止挂载 /api/_dev/* 手动触发器
  dev_tick_enabled: false

# --- M2.0 新增：成本闸门 ---
# M1.2 决策 Q8=B：价目缺失时默认拒绝调用，不做"按猜测值硬跑"。
cost:
  currency: CNY
  # 当日总预算上限（超限只拒绝新任务，不中断已在跑的任务）
  daily_cap_cny: 5.0
  # 单个研究任务的默认预算（调用次数与金额）
  default_task_calls: 60
  default_task_cost_cny: 2.0
  # 人工批准例外后按此上界预留
  unknown_price_upper_bound_cny: 0.05
  pricing_policy: reject_unknown

# --- M2.0 新增：能力开关（与 integrations 互补，避免双份真相） ---
# 注意：llm_providers / web_search / vector_store / video_rendering 四个键
# 继续由上面的 integrations 段与 video 段派生，这里只放 2.0 新增的三个开关。
features:
  # 真实模型调用开关。2026-11-12 用户提供 DeepSeek API Key 并授权启用。
  # 关掉它就是"一键停服"：网关会在发请求之前返回 feature_disabled，不花钱。
  model: true
  search: false
  execution: false

# --- 第二阶段预留：模型与检索接入（第一阶段未实现任何调用） ---
integrations:
  llm:
    enabled: false
    provider: null          # 例如 deepseek / openai / local
    base_url: null          # 从环境变量读取，不写入仓库
    model: null
  web_search:
    enabled: false
    provider: null
  vector_store:
    enabled: false
    # 约束：第一阶段不引入独立向量数据库，检索用数据库全文/模糊匹配

video:
  # 默认竖屏规格，适配抖音/小红书
  width: 1080
  height: 1920
  fps: 30
  aspect_ratio: "9:16"
  audio_sample_rate: 48000
  subtitle_format: srt
  # 工具链解析顺序：显式参数 > 本配置 ffmpeg_dir > tools/ffmpeg/bin > 系统 PATH。
  # 项目独立完整构建由 backend/scripts/install_ffmpeg.py 安装（V2.2 Phase 1），
  # 不修改系统 PATH，也不覆盖系统已装的 FFmpeg。
  ffmpeg_dir: tools/ffmpeg/bin
  ffmpeg_binary: ffmpeg
  # OpenKatana 0.1.3 的 -fps_mode 自 FFmpeg 5.1 起可用，低于该版本拒绝素材导入路径
  ffmpeg_min_version: "5.1"
  # 第一阶段不执行渲染，仅定义规格
  rendering_enabled: false
