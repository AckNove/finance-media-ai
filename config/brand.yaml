# ============================================================
# 品牌配置（正式战略版本 2.0，2026-11-09 确认）
# 说明：
#   - 常量型品牌信息。任何真实姓名、联系方式、账号密码都不写在此处。
#   - 修改本文件时必须同步 docs/brand_strategy.md 与 config/content_taxonomy.yaml。
#   - 本文件只描述"我们是谁、怎么说话"，不描述具体选题（选题分类见 content_taxonomy.yaml）。
# ============================================================

brand:
  # 项目/仓库代号（机器用，不是对外品牌名）
  name: finance-media-ai
  # 个人 IP：对外账号名称。主页只显示这个，不额外挂正式品牌名。
  ip_name: 电力之王AK
  # 正式内容品牌：出现在内容片头/栏目/署名，不出现在主页账号名位置。
  brand_name: AK带你拆解世界
  # 品牌主张（对外一句话）
  slogan: 用金融与商业视角，拆解世界运行的逻辑。
  # 正式名称字段保留：供接口/模板展示内容品牌全名使用
  display_name: AK带你拆解世界
  tagline: 用金融与商业视角，拆解世界运行的逻辑
  positioning: >
    一个以金融与商业研究为核心，通过金融知识、财经时事、产业链、公司和商业案例，
    帮助大众理解世界运行逻辑的个人知识品牌。
  mission: >
    把复杂的金融和商业问题讲清楚，让更多人看懂新闻背后的逻辑、行业背后的利益关系，
    以及企业背后的经营规律。
  personality:
    - 专业：先讲清机制，再谈观点
    - 犀利：敢下判断，但判断必须有证据
    - 独立：不为流量与商业合作改变结论
    - 有趣：可以幽默，但不低俗、不油腻
    - 求真：宁可说"不知道"，也不编造
  language: zh-CN

# 电力之王的说明：昵称与记忆点，不代表账号专门研究电力行业。
ip_name_note: >
  "电力之王AK" 是创作者的昵称与品牌记忆点，与电力行业研究无关。
  账号内容按 config/content_taxonomy.yaml 的六大合集组织，不因昵称被限制在某一行业。

# ------------------------------------------------------------
# 受众
# ------------------------------------------------------------
audience:
  primary: 希望看懂新闻背后逻辑、愿意花时间学习的普通大众与学习者
  included:
    - 希望学习金融知识的普通大众
    - 对财经热点感兴趣的人群
    - 希望提升金融认知的学习者
    - 对产业链和公司研究感兴趣的人群
    - 创业者与企业经营者
    - 商业研究爱好者
  assumed_knowledge: 不假定金融从业经验，也不假定零基础；同一选题可出多版本
  tiers_ref: config/content_taxonomy.yaml#audience_levels
  excluded:
    - 寻求具体投资买卖建议的人群
    - 希望获得"明天买什么"答案的人群
  rule: 不能为了覆盖全部人群而降低专业质量；覆盖面靠多版本，不靠稀释内容。

# ------------------------------------------------------------
# 表达风格
# ------------------------------------------------------------
tone:
  primary_style: 观点鲜明、犀利、有趣的专业讲解
  secondary_style: 纪录片式叙事 + 适度幽默与调侃
  # 该键被测试与提示词引用：足球是合集之一，也是教学场景，但不是内容边界
  football_element: >
    足球是六大合集之一（football_finance），也是讲金融机制时的类比场景；
    它是教学工具与独立研究领域，不是账号的内容边界。
  requirements:
    - 专业但不卖弄术语：术语首次出现给英文原文与一句话解释
    - 有观点但不脱离证据：每个判断能指回 evidence
    - 可以幽默、调侃，但不低俗、不嘲讽具体的普通人
    - 不做简单新闻搬运：必须给出增量分析
    - 善于从热点中提出值得思考的问题
    - 用真实案例和数据解释金融与商业逻辑
    - 研究结论必须可追溯到可靠来源
  forbidden:
    - 为了趣味性扭曲真实金融机制
    - 用足球类比替代真实的金融定义与公式
    - 承诺收益、暗示稳赚、暗示内幕
    - 面向个人的具体投资买卖建议（标的、点位、仓位、时点）
    - 用情绪替代证据（煽动性标题与结论）
    - 未披露利益关系的商业合作内容

# ------------------------------------------------------------
# 视觉风格与出镜方式
# ------------------------------------------------------------
visual:
  style: 专业研究 + 纪录片叙事 + 适当幽默
  default_canvas: {width: 1080, height: 1920, fps: 30, aspect_ratio: "9:16"}
  palette_note: 深色底 + 高对比数据色，图表优先于装饰；不使用土味特效与廉价花字。

on_camera:
  policy: 选择性真人出镜
  voice_sources:
    - 真人声音（本人录音）
    - 授权 AI 声音（需明确授权来源）
    - AI 图解与动画（无人声）
  rules:
    - 重要专题优先真人出镜
    - 常规内容允许纯 AI 图解 + 配音
    - 使用 AI 声音时不得模仿未授权的第三方声音
    - 真人出镜内容的事实与观点必须经本人审核

# ------------------------------------------------------------
# 足球类比政策（被 fact_checker 强制校验）
# ------------------------------------------------------------
analogy_policy:
  # 足球类比必须双向说明：哪里成立、哪里不成立
  require_scope_statement: true
  require_limitations_statement: true
  max_analogy_share_of_script: 0.35
  applies_to: [football_explainer, financial_mechanism, industry_research, case_documentary]
  note: >
    类比是脚手架，不是证据；一旦类比的边界不清，必须显式标注不成立的部分。
    足球是六大合集之一，允许在其它合集里作为类比出现，但必须说明适用范围。

# ------------------------------------------------------------
# 平台与发布
# ------------------------------------------------------------
platforms:
  primary:
    - name: 抖音
      aspect_ratio: "9:16"
      default_duration_seconds: 180
    - name: 小红书
      aspect_ratio: "9:16"
      default_duration_seconds: 180
  secondary:
    - name: 微信公众号
      aspect_ratio: null
      default_duration_seconds: null
    - name: bilibili
      aspect_ratio: "16:9 | 9:16"
      default_duration_seconds: 480
  # 实际分发由人工完成，系统不自动发布
  auto_publish: false

# ------------------------------------------------------------
# 商业与披露（细则见 docs/business_model.md）
# ------------------------------------------------------------
business:
  revenue_lines: [free_content, membership, courses, brand_collaboration]
  disclosure_required: true
  collaboration_rule: >
    商业合作必须披露利益关系，且不得影响研究结论；出现品牌方要求修改结论时，
    必须终止合作并在内容中说明。
  paid_content_red_line: >
    付费内容只能是金融教育、公开资料研究与分析方法，不得构成收费荐股、
    代客理财或个性化证券投资咨询。
