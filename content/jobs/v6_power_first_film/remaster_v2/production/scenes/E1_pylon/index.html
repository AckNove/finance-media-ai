<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>E1_pylon</title>
<style>
  @font-face {
    font-family: "AKSC";
    src: url("fonts/NotoSansSC-VF.ttf") format("truetype");
    font-display: block;
  }
  html, body { margin: 0; padding: 0; background: #05070c; }
  #stage {
    position: relative;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: #05070c;
    font-family: "AKSC", "Microsoft YaHei", sans-serif;
  }
  #photo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform-origin: 50% 50%;
    will-change: transform;
    filter: contrast(1.18) saturate(1.08) brightness(0.92) sepia(0.08);
  }
  /* 电影感：上下压暗 + 一级调色（青蓝阴影 / 暖高光） */
  .grade-top {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(6,14,26,0.55) 0%, rgba(6,14,26,0.0) 28%);
    mix-blend-mode: multiply;
  }
  .grade-bottom {
    position: absolute; inset: 0;
    background: linear-gradient(0deg, rgba(4,8,16,0.92) 0%, rgba(4,8,16,0.55) 22%, rgba(4,8,16,0.0) 46%);
  }
  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 46%, rgba(0,0,0,0) 42%, rgba(0,0,0,0.55) 100%);
    pointer-events: none;
  }
  .ak-text {
    position: absolute;
    left: 72px; right: 72px;
    color: #f2f5f7;
    line-height: 1.22;
    white-space: pre-wrap;
    text-shadow: 0 2px 18px rgba(0,0,0,0.85);
    will-change: opacity, transform;
  }
  #label {
    position: absolute;
    left: 40px; top: 40px;
    padding: 8px 16px;
    border: 1px solid rgba(242,245,247,0.35);
    border-radius: 4px;
    color: rgba(242,245,247,0.86);
    font-size: 24px;
    letter-spacing: 2px;
    background: rgba(4,8,16,0.45);
    opacity: 0.9;
  }
  #credit {
    position: absolute;
    left: 72px; bottom: 26px;
    color: rgba(242,245,247,0.5);
    font-size: 20px;
    letter-spacing: 0.4px;
  }
</style>
</head>
<body>
<div id="stage">
  <img id="photo" src="photo.jpg" alt="">
  <div class="grade-top"></div>
  <div class="grade-bottom"></div>
  <div class="vignette"></div>
  <div id="label">资料画面</div>
  <div class="ak-text" data-at="0.150" style="top:1181px;font-size:30px;color:#f2f5f7;text-align:left;opacity:0">真实输电线路 · 资料画面</div>
  <div class="ak-text" data-at="0.450" style="top:1267px;font-size:62px;color:#f2f5f7;text-align:left;opacity:0">钱没有变多，
只是分法变了</div>
  <div id="credit">Rincewind42 · CC BY 2.0</div>
</div>
<script>
const SCENE = {"fps": 30, "duration": 5.2, "width": 1080, "height": 1920, "move": {"z0": 1.16, "z1": 1.03, "x0": 0.02, "x1": -0.01, "y0": 0.0, "y1": -0.015, "ease": "smooth"}};
const photo = document.getElementById("photo");
const nodes = Array.from(document.querySelectorAll(".ak-text"));

function smooth(x) { return x * x * (3 - 2 * x); }
function ease(t) {
  if (SCENE.move.ease === "linear") return t;
  return smooth(Math.min(1, Math.max(0, t)));
}

function seek(t) {
  const k = ease(SCENE.duration > 0 ? t / SCENE.duration : 1);
  const m = SCENE.move;
  const z = m.z0 + (m.z1 - m.z0) * k;
  const dx = (m.x0 + (m.x1 - m.x0) * k) * 100;
  const dy = (m.y0 + (m.y1 - m.y0) * k) * 100;
  photo.style.transform = `translate(${-dx}%, ${-dy}%) scale(${z})`;
  for (const node of nodes) {
    const at = Number(node.dataset.at || 0);
    const span = 0.45;
    const p = Math.min(1, Math.max(0, (t - at) / span));
    node.style.opacity = String(p);
    node.style.transform = `translateY(${(1 - p) * 18}px)`;
  }
}

window.__AK = { fps: SCENE.fps, duration: SCENE.duration, width: SCENE.width, height: SCENE.height };
window.__seek = seek;

function ready() {
  seek(0);
  window.__ready = true;
}
if (photo.complete && photo.naturalWidth > 0) {
  ready();
} else {
  photo.addEventListener("load", ready);
  photo.addEventListener("error", () => { window.__errors = ["图片加载失败"]; window.__ready = true; });
}
</script>
</body>
</html>
